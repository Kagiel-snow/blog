<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="几个贴着标签的盒子，分别装着数字、字符和小数">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f4a63"/>
      <stop offset="1" stop-color="#1b2b3b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.06">
    <circle cx="1060" cy="110" r="160"/>
    <circle cx="140" cy="560" r="200"/>
  </g>
  <g font-family="'JetBrains Mono','Consolas',monospace" text-anchor="middle">
    <g transform="translate(150 110)">
      <rect width="230" height="190" rx="18" fill="#e9f0f6"/>
      <rect x="45" y="-26" width="140" height="48" rx="10" fill="#f6d9a6"/>
      <text x="115" y="8" font-size="26" fill="#2f3b48">int</text>
      <text x="115" y="125" font-size="72" fill="#3d6a92" font-weight="700">18</text>
    </g>
    <g transform="translate(485 110)">
      <rect width="230" height="190" rx="18" fill="#e9f0f6"/>
      <rect x="45" y="-26" width="140" height="48" rx="10" fill="#f6d9a6"/>
      <text x="115" y="8" font-size="26" fill="#2f3b48">char</text>
      <text x="115" y="125" font-size="72" fill="#3d6a92" font-weight="700">'A'</text>
    </g>
    <g transform="translate(820 110)">
      <rect width="230" height="190" rx="18" fill="#e9f0f6"/>
      <rect x="45" y="-26" width="140" height="48" rx="10" fill="#f6d9a6"/>
      <text x="115" y="8" font-size="26" fill="#2f3b48">double</text>
      <text x="115" y="125" font-size="64" fill="#3d6a92" font-weight="700">3.14</text>
    </g>
  </g>
